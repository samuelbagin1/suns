<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="480" viewBox="0 0 1760 480" role="img" aria-labelledby="title description">
  <title id="title">Architektúra TinyViT pre odhad kalórií</title>
  <desc id="description">Široký prehľad modelu TinyViT. Normalizovaná RGB fotka sa rozdelí na 36 výrezov. Každý výrez sa premietne do 64-rozmerného tokenu. Po pridaní CLS a pozičných vektorov sekvencia prejde tromi blokmi Transformeru so štyrmi hlavami. Regresná hlava spracuje výsledný CLS a predikuje energiu v kcal.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" viewBox="0 0 6 6">
      <path d="M1 1 5.5 3 1 5" fill="none" stroke="#556471" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
