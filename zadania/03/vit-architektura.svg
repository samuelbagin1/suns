      .detail { font-size: 16px; fill: #4c5d70; }
      .operator { font-size: 15px; font-weight: 600; fill: #40526a; }
      .dimension { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .small { font-size: 14px; font-weight: 600; fill: #40526a; }
      .unit { font-size: 23px; font-weight: 700; }
      .note { font-size: 17px; fill: #45546a; }
      .note-label { font-size: 17px; font-weight: 700; }
      .arrow { fill: none; stroke: #556471; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
